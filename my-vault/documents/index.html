<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents | Kagan Demirer</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Particles -->
    <canvas id="bg-canvas"></canvas>

    <!-- Spotlight Effect -->
    <div class="spotlight"></div>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress"></div>

    <nav class="navbar">
        <a href="../../index.html" class="logo">KD.</a>
        <div class="nav-links">
            <div class="language-switcher">
                <button class="lang-btn" id="lang-btn" aria-label="Select Language">
                    <span class="current-flag">🇬🇧</span>
                    <span class="current-lang">EN</span>
                    <svg class="lang-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="lang-dropdown" id="lang-dropdown">
                    <button class="lang-option" data-lang="en"><span class="lang-flag">🇬🇧</span> EN</button>
                    <button class="lang-option" data-lang="de"><span class="lang-flag">🇩🇪</span> DE</button>
                    <button class="lang-option" data-lang="tr"><span class="lang-flag">🇹🇷</span> TR</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section style="padding-top: 150px; padding-bottom: 50px; padding-left: 5%; padding-right: 5%; max-width: 1400px; margin: 0 auto;">
            <div class="section-header">
                <h2 class="section-title" data-i18n="documentsTitle">Documents</h2>
                <div class="section-line"></div>
            </div>

            <div class="minimal-container">
                <!-- Bachelor Degree -->
                <a href="Bachelorabschluss.pdf" target="_blank" class="minimal-item">
                    <div class="minimal-icon">
                        <img src="../../images/document.png" alt="Bachelor Degree">
                    </div>
                    <div class="minimal-content">
                        <h3 class="minimal-title" data-i18n="bachelorDegreeTitle">Bachelor's Degree</h3>
                        <p class="minimal-desc" data-i18n="bachelorDegreeDesc">My Bachelor of Science degree certificate (B.Sc. Informatik, DHBW Stuttgart).</p>
                        <div class="minimal-tags">
                            <span class="minimal-tag">B.Sc.</span>
                            <span class="minimal-tag">PDF</span>
                        </div>
                    </div>
                    <div class="minimal-arrow"><i class="fas fa-arrow-right"></i></div>
                </a>

                <!-- Resume -->
                <a href="Lebenslauf.pdf" target="_blank" class="minimal-item">
                    <div class="minimal-icon">
                        <img src="../../images/cv.png" alt="CV">
                    </div>
                    <div class="minimal-content">
                        <h3 class="minimal-title">Resume</h3>
                        <p class="minimal-desc" data-i18n="resumeDesc">My complete professional resume detailing my career path, skills, and education.</p>
                        <div class="minimal-tags">
                            <span class="minimal-tag">CV</span>
                            <span class="minimal-tag">PDF</span>
                        </div>
                    </div>
                    <div class="minimal-arrow"><i class="fas fa-arrow-right"></i></div>
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="social-links">
            <a href="https://github.com/KaganDemirer" target="_blank" class="social_icon">GitHub</a>
            <a href="https://www.linkedin.com/in/kagan-demirer-aa9b89240/" target="_blank" class="social_icon">LinkedIn</a>
            <a href="https://www.xing.com/profile/Kagan_Demirer017686/web_profiles" target="_blank" class="social_icon">Xing</a>
        </div>
        <p class="copyright" data-i18n="footerText">© 2025 Kağan Demirer.</p>
    </footer>

    <script src="../../js/main.js"></script>
</body>
</html>
